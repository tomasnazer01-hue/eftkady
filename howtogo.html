<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<link rel="manifest" href="./htg.webmanifest">
<link rel="icon" href="./htg-192.png">
<link rel="apple-touch-icon" href="./htg-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أوصل ازاي"><title>أوصل ازاي</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#1B2A4A;--gold:#C9A24B;--bg:#f4f5f8;--card:#fff;--tx:#1b2030;--mut:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2c;--tx:#eef0f6;--mut:#9aa1b3}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:12px 12px 40px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 auto 12px;max-width:640px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h1,h2{margin:0}h1{font-size:20px;color:var(--ink)}@media(prefers-color-scheme:dark){h1{color:var(--gold)}}
.muted{color:var(--mut)}.row{display:flex;align-items:center}.grow{flex:1;min-width:0}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #cfd3dc;background:var(--card);color:var(--tx);font:inherit}
.btn{border:1px solid #cfd3dc;background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.btn-gold{background:var(--gold);color:#1b1b1b;border:none;font-weight:700}.btn-sm{padding:8px 10px;font-size:13px}.btn-block{display:block;width:100%}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1B2A4A;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9999}
</style></head><body>
<div class="card"><h1>🧭 أوصل ازاي</h1>
<label style="font-weight:700;font-size:13px;margin-top:10px;display:block">📍 أنا فين؟ (نقطة البداية)</label>
<div class="row" style="gap:6px;flex-wrap:wrap;margin:6px 0">
<button type="button" class="btn btn-gold btn-sm" id="htgGps">📡 موقعي الحالي</button>
<button type="button" class="btn btn-sm" id="htgPick">🗺️ حدد على الخريطة</button></div>
<div class="row" style="gap:6px"><input type="text" id="htgFrom" class="grow" placeholder="أو اكتب اسم شارع / مكان البداية"><button type="button" class="btn btn-sm" id="htgFromSearch">بحث</button></div>
<div id="htgFromInfo" class="muted" style="font-size:12px;margin:4px 0"></div>
<label style="font-weight:700;font-size:13px;margin-top:8px;display:block">🎯 رايح فين؟</label>
<div class="row" style="gap:6px"><input type="text" id="htgTo" class="grow" placeholder="اكتب اسم الشارع أو المكان (في حدود ٢ كم منك)"><button type="button" class="btn btn-sm" id="htgToSearch">بحث</button></div>
<div id="htgToInfo" class="muted" style="font-size:12px;margin:4px 0"></div>
<div class="row" style="gap:6px;margin-top:6px"><select id="htgMode" class="grow"><option value="driving">🚗 بالعربية / المواصلات</option><option value="foot">🚶 مشي</option></select>
<button type="button" class="btn btn-gold" id="htgGo">🧭 وريني الطريق</button></div></div>
<div class="card"><div id="htgMapHint" class="muted" style="font-size:12px;margin-bottom:4px"></div><div id="htgMap" style="height:300px;border-radius:12px;overflow:hidden"></div></div>
<div class="card" id="areaCard">
        <h2 style="margin:0 0 4px;font-size:17px">🏘️ مربعاتي السكنية</h2>
        <p class="muted" style="margin:0 0 6px;font-size:12px">زي تحديد الموقع في وزنتي: دوس على الخريطة في وسط المنطقة (أو استخدم موقعك أو دوّر باسم شارع) والمربع بيتحط لوحده. بيظهر فيه كل الشوارع وبتحفظه باسم.</p>
        <button type="button" class="btn btn-gold btn-block btn-sm" id="areaGps" style="margin-bottom:6px">📡 استخدام موقعي الحالي</button>
        <div class="row" style="gap:6px;margin-bottom:6px"><input type="search" id="areaQ" class="grow" placeholder="🔍 ابحث باسم الشارع أو المنطقة"><button type="button" class="btn btn-gold btn-sm" id="areaQBtn">بحث</button></div>
        <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center"><span style="font-size:12.5px">📐 حجم المربع:</span>
          <select id="areaSize"><option value="300">صغير (٣٠٠ م)</option><option value="600" selected>متوسط (٦٠٠ م)</option><option value="1000">كبير (١ كم)</option><option value="2000">كبير جداً (٢ كم)</option></select>
          <button type="button" class="btn btn-sm" id="areaDraw">👆 دوس على الخريطة</button>
          <button type="button" class="btn btn-sm" id="areaLock" style="display:none">🔓 ثبّت الخريطة</button></div>
        <div id="areaHint" class="muted" style="font-size:12px;margin:6px 0"></div>
        <div class="row" id="areaSaveRow" style="gap:6px;display:none"><input type="text" id="areaName" class="grow" placeholder="اسم المربع (مثلاً: حينا)"><button type="button" class="btn btn-gold btn-sm" id="areaSave">💾 حفظ</button></div>
        <div id="areaList" style="margin-top:8px"></div>
        <div id="areaStreets" style="margin-top:8px"></div>
      </div>
 <div class="card" id="htgResult" style="display:none"></div>
<div class="card" id="htgInstall" style="display:none;text-align:center"><button type="button" class="btn btn-gold btn-block" id="htgInstallBtn">📲 نزّل التطبيق على موبايلك</button><div id="htgIosHint" class="muted" style="font-size:12.5px;margin-top:6px;display:none">على الآيفون: دوس زرار المشاركة ⬆️ ثم "إضافة إلى الشاشة الرئيسية"</div></div>
<div id="toast"></div>
<script>
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2500);}
const HTG = {from:null, to:null, map:null, layer:null, fromM:null, toM:null, picking:false};
function htgEsc(t){ return String(t==null?"":t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function htgEnsureMap(){
  if(typeof L==="undefined"){ toast("تعذر تحميل الخريطة، جرب شبكة تانية"); return false; }
  if(HTG.map){ setTimeout(()=>HTG.map.invalidateSize(), 80); return true; }
  HTG.map = L.map("htgMap").setView([30.0444,31.2357], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap contributors', maxZoom:19}).addTo(HTG.map);
  HTG.map.on("click", e=>{
    if(!HTG.picking) return;
    HTG.picking = false;
    htgSetPoint("from", {lat:e.latlng.lat, lng:e.latlng.lng, label:"النقطة اللي حددتها على الخريطة"});
    document.getElementById("htgMapHint").textContent = "";
  });
  setTimeout(()=>HTG.map.invalidateSize(), 120);
  if(typeof areaMapReady==="function") areaMapReady();
  return true;
}
function htgSetPoint(which, pt){
  HTG[which] = pt;
  const infoId = which==="from" ? "htgFromInfo" : "htgToInfo";
  document.getElementById(infoId).textContent = "✅ " + pt.label;
  if(!HTG.map) return;
  const key = which==="from" ? "fromM" : "toM";
  if(HTG[key]) HTG.map.removeLayer(HTG[key]);
  HTG[key] = L.marker([pt.lat, pt.lng]).addTo(HTG.map).bindPopup(which==="from" ? "من" : "إلى");
  HTG.map.setView([pt.lat, pt.lng], 15);
}
function htgDist(a,b){ const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng); const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const HTG_RADIUS = 2000; // البحث عن الوجهة في حدود ٢ كم من مكانك بس
async function htgGeocode(q, local){
  let url = `https://nominatim.openstreetmap.org/search?format=json&limit=20&accept-language=ar&q=${encodeURIComponent(q)}`;
  if(local){
    const f = HTG.from, dLat = HTG_RADIUS/111000, dLng = HTG_RADIUS/(111000*Math.cos(f.lat*Math.PI/180));
    url += `&viewbox=${f.lng-dLng},${f.lat+dLat},${f.lng+dLng},${f.lat-dLat}&bounded=1`;
  }else url += "&countrycodes=eg";
  const res = await fetch(url);
  if(!res.ok) throw new Error("geocode "+res.status);
  let r = await res.json();
  if(local){ r = r.filter(x=>htgDist(HTG.from,{lat:+x.lat,lng:+x.lon})<=HTG_RADIUS).slice(0,6); }
  return r;
}
async function htgSearch(which){
  const inp = document.getElementById(which==="from" ? "htgFrom" : "htgTo");
  const q = inp.value.trim();
  if(!q){ toast("اكتب اسم الشارع الأول"); return; }
  const info = document.getElementById(which==="from" ? "htgFromInfo" : "htgToInfo");
  info.textContent = "⏳ بدوّر...";
  try{
    await htgEnsureMap();
    const local = which==="to";
    if(local && !HTG.from){ info.textContent = "📍 حدد مكانك الأول (موقعي / الخريطة) — البحث عن الوجهة بيبقى في حدود ٢ كم منك"; return; }
    const r = await htgGeocode(q, local);
    if(!r || !r.length){ info.textContent = local ? "❌ ملقيتش المكان ده في حدود ٢ كم من مكانك" : "❌ ملقيتش المكان ده — جرب تكتب اسم الشارع واسم المنطقة/المدينة"; return; }
    if(r.length===1){ htgSetPoint(which, {lat:+r[0].lat, lng:+r[0].lon, label:r[0].display_name}); return; }
    info.innerHTML = "اختار المكان الصح:" + r.map((x,i)=>`<div><button type="button" class="btn btn-sm" style="margin:3px 0;text-align:right;white-space:normal" data-htg-pick="${which}:${i}">📍 ${htgEsc(x.display_name)}</button></div>`).join("");
    info._res = r;
    info.querySelectorAll("[data-htg-pick]").forEach(b=>b.addEventListener("click", ()=>{
      const i = +b.dataset.htgPick.split(":")[1], x = info._res[i];
      htgSetPoint(which, {lat:+x.lat, lng:+x.lon, label:x.display_name});
    }));
  }catch(err){ console.error(err); info.textContent = "❌ البحث مش شغال دلوقتي (النت أو السيرفر) — جرب تاني"; }
}
function htgGps(){
  const info = document.getElementById("htgFromInfo");
  if(!navigator.geolocation){ info.textContent = "❌ الجهاز مش بيدعم تحديد الموقع"; return; }
  info.textContent = "⏳ بحدد موقعك...";
  navigator.geolocation.getCurrentPosition(async pos=>{
    await htgEnsureMap();
    htgSetPoint("from", {lat:pos.coords.latitude, lng:pos.coords.longitude, label:"موقعي الحالي"});
  }, err=>{
    info.textContent = "❌ مقدرتش أحدد موقعك — اسمح للمتصفح بالوصول للموقع، أو حدد على الخريطة";
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
}
function htgStepText(st){
  const m = st.maneuver||{}, t = m.type, mod = m.modifier, name = st.name ? ` في ${st.name}` : "";
  const dirs = {"left":"شمال","right":"يمين","slight left":"شمال شوية","slight right":"يمين شوية","sharp left":"شمال بحدة","sharp right":"يمين بحدة","straight":"على طول","uturn":"لف للخلف"};
  const d = dirs[mod] || "";
  if(t==="depart") return `ابدأ${st.name?" من "+st.name:""}${d&&mod!=="straight"?" واتجه "+d:""}`;
  if(t==="arrive") return "وصلت لوجهتك 🎯";
  if(t==="roundabout"||t==="rotary"||t==="roundabout turn") return `ادخل الدوران وخد المخرج رقم ${m.exit||"؟"}${name}`;
  if(t==="turn"||t==="end of road"||t==="fork"||t==="on ramp"||t==="off ramp"||t==="merge"||t==="new name"||t==="continue"){
    if(mod==="straight"||!mod) return `كمّل على طول${name}`;
    if(mod==="uturn") return `لف للخلف${name}`;
    return `لف ${d}${name}`;
  }
  return `كمّل${name}`;
}
function htgFmtDist(m){ return m>=1000 ? (m/1000).toFixed(1)+" كم" : Math.round(m/10)*10+" م"; }
function htgFmtTime(sec){ const mn = Math.round(sec/60); if(mn<60) return mn+" دقيقة"; const h=Math.floor(mn/60); return h+" س "+(mn%60)+" د"; }
async function htgRoute(){
  if(!HTG.from){ toast("حدد مكانك الأول (موقعي / الخريطة / اسم شارع)"); return; }
  if(!HTG.to){ toast("حدد المكان اللي رايحله (اكتب الاسم واضغط بحث)"); return; }
  const mode = document.getElementById("htgMode").value;
  const box = document.getElementById("htgResult");
  box.style.display = ""; box.innerHTML = '<p class="muted">⏳ بحسب الطريق...</p>';
  const gm = `https://www.google.com/maps/dir/?api=1&origin=${HTG.from.lat},${HTG.from.lng}&destination=${HTG.to.lat},${HTG.to.lng}&travelmode=${mode==="foot"?"walking":"driving"}`;
  const gbtn = `<a class="btn btn-gold btn-block" style="margin-top:8px;text-decoration:none;text-align:center" target="_blank" rel="noopener" href="${gm}">🗺️ افتح في خرائط جوجل (ملاحة صوتية)</a>`;
  try{
    const bases = mode==="foot"
      ? ["https://routing.openstreetmap.de/routed-foot/route/v1/foot","https://routing.openstreetmap.de/routed-foot/route/v1/driving"]
      : ["https://router.project-osrm.org/route/v1/driving","https://routing.openstreetmap.de/routed-car/route/v1/driving"];
    let data = null, lastErr = "";
    for(const base of bases){
      try{
        const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 12000);
        const res = await fetch(`${base}/${HTG.from.lng},${HTG.from.lat};${HTG.to.lng},${HTG.to.lat}?overview=full&geometries=geojson&steps=true`, {signal:ctl.signal});
        clearTimeout(tm);
        const j = await res.json().catch(()=>null);
        if(res.ok && j && j.code==="Ok" && j.routes && j.routes.length){ data = j; break; }
        lastErr = (j && (j.code||j.message)) || ("HTTP "+res.status);
      }catch(e){ lastErr = e && e.name==="AbortError" ? "timeout" : (e && e.message) || "network"; }
    }
    if(!data) throw new Error(lastErr);
    const r = data.routes[0];
    await htgEnsureMap();
    if(HTG.layer) HTG.map.removeLayer(HTG.layer);
    HTG.layer = L.geoJSON(r.geometry, {style:{color:"#1B2A4A", weight:5, opacity:.85}}).addTo(HTG.map);
    try{ HTG.map.fitBounds(HTG.layer.getBounds(), {padding:[20,20]}); }catch(_){}
    const steps = (r.legs||[]).flatMap(l=>l.steps||[]);
    box.innerHTML = `<h2 style="margin:0 0 4px">📏 ${htgFmtDist(r.distance)} · ⏱️ ${htgFmtTime(r.duration)}</h2>
      <p class="muted" style="margin:0 0 6px;font-size:12px">من: ${htgEsc(HTG.from.label)}<br>إلى: ${htgEsc(HTG.to.label)}</p>
      <ol style="padding-inline-start:22px;margin:6px 0;line-height:1.9;font-size:14px">${steps.map(st=>`<li>${htgEsc(htgStepText(st))}${st.distance>0&&st.maneuver?.type!=="arrive"?` <span class="muted" style="font-size:12px">(${htgFmtDist(st.distance)})</span>`:""}</li>`).join("")}</ol>
      <p class="muted" style="font-size:11.5px">⚠️ الخطوات تقريبية من خرائط OpenStreetMap، ولو الطريق مهم اتأكد منه بخرائط جوجل.</p>${gbtn}`;
  }catch(err){
    console.error(err);
    box.innerHTML = `<p>❌ معرفتش أحسب الطريق جوه التطبيق (${htgEsc(err&&err.message||"")}). ممكن السيرفر مشغول أو مفيش طريق بين النقطتين. تقدر تفتحه مباشرة في خرائط جوجل:</p>${gbtn}`;
  }
}


// ==================== 🏘️ مربعاتي السكنية ====================
const AREA = {pts:[], rect:null, cur:null, streetLayer:null, drawing:false, locked:false, lines:[]};
function areaLoad(){ try{ return JSON.parse(localStorage.getItem("htg_areas")||"[]"); }catch(_){ return []; } }
function areaStore(a){ try{ localStorage.setItem("htg_areas", JSON.stringify(a)); return true; }catch(_){ toast("مقدرتش أحفظ على الجهاز"); return false; } }
function areaMapReady(){ if(HTG.map && !HTG.map._areaHooked){ HTG.map._areaHooked = true; HTG.map.on("click", areaClick); } }
function areaSize(){ return +document.getElementById("areaSize").value || 600; }
let _areaT = null;
function areaSetCenter(lat, lng){
  const half = areaSize()/2, dLat = half/111000, dLng = half/(111000*Math.cos(lat*Math.PI/180));
  AREA.cur = {name:"", center:[lat,lng], bounds:[[lat-dLat,lng-dLng],[lat+dLat,lng+dLng]]};
  areaShowRect();
  document.getElementById("areaHint").textContent = "✅ اكتب اسم للمنطقة واضغط حفظ (أو دوس مكان تاني على الخريطة لتحريك المربع)";
  document.getElementById("areaSaveRow").style.display = "";
  clearTimeout(_areaT); _areaT = setTimeout(areaLoadStreets, 700);
}
function areaClick(e){ if(AREA.drawing) areaSetCenter(e.latlng.lat, e.latlng.lng); }
function areaShowRect(){
  if(AREA.rect) HTG.map.removeLayer(AREA.rect);
  AREA.rect = L.rectangle(AREA.cur.bounds, {color:"#C9A24B", weight:3, fillOpacity:.07}).addTo(HTG.map);
  HTG.map.fitBounds(AREA.cur.bounds, {padding:[10,10]});
  document.getElementById("areaLock").style.display = "";
}
function areaClearStreets(){ if(AREA.streetLayer){ HTG.map.removeLayer(AREA.streetLayer); AREA.streetLayer=null; } AREA.lines=[]; document.getElementById("areaStreets").innerHTML=""; }
async function areaLoadStreets(){
  const box = document.getElementById("areaStreets"), a = AREA.cur;
  areaClearStreets();
  let ways = a.ways;
  if(!ways){
    box.innerHTML = '<p class="muted">⏳ بجيب الشوارع...</p>';
    const [s,w] = a.bounds[0], [n,e] = a.bounds[1];
    const q = `[out:json][timeout:25];way["highway"]["name"](${s},${w},${n},${e});out geom;`;
    for(const srv of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
      try{
        const res = await fetch(srv+"?data="+encodeURIComponent(q));
        if(!res.ok) continue;
        const j = await res.json();
        ways = (j.elements||[]).filter(x=>x.geometry&&x.tags&&x.tags.name).map(x=>({name:x.tags["name:ar"]||x.tags.name, g:x.geometry.map(p=>[+p.lat.toFixed(6),+p.lon.toFixed(6)])}));
        break;
      }catch(_){}
    }
    if(!ways){ box.innerHTML = '<p>❌ معرفتش أجيب الشوارع (النت أو السيرفر) — جرب تاني</p>'; return; }
    a.ways = ways;
    if(a.id){ const all = areaLoad(), i = all.findIndex(x=>x.id===a.id); if(i>=0){ all[i].ways = ways; areaStore(all); } }
  }
  if(!ways.length){ box.innerHTML = '<p class="muted">مفيش شوارع مسمّية جوه المربع ده.</p>'; return; }
  AREA.streetLayer = L.layerGroup().addTo(HTG.map);
  const byName = {};
  ways.forEach(w=>{ (byName[w.name] = byName[w.name]||[]).push(w); });
  const names = Object.keys(byName).sort((x,y)=>x.localeCompare(y,"ar"));
  names.forEach(n=>{
    const lines = byName[n].map(w=>L.polyline(w.g, {color:"#1B2A4A", weight:5, opacity:.8}).bindTooltip(n, {sticky:true}).addTo(AREA.streetLayer));
    lines.forEach(l=>l.on("click", ()=>areaPickStreet(n)));
    AREA.lines.push({n, lines});
  });
  box.innerHTML = `<b style="font-size:13px">🛣️ الشوارع (${names.length}) — دوس على شارع عشان تروحله</b>` + names.map(n=>`<button type="button" class="btn btn-sm" style="margin:3px;white-space:normal" data-area-st="${htgEsc(n)}">${htgEsc(n)}</button>`).join("");
  box.querySelectorAll("[data-area-st]").forEach(b=>b.addEventListener("click", ()=>areaPickStreet(b.dataset.areaSt)));
}
function areaPickStreet(name){
  const item = AREA.lines.find(x=>x.n===name); if(!item) return;
  AREA.lines.forEach(x=>x.lines.forEach(l=>l.setStyle({color:x.n===name?"#d33":"#1B2A4A", weight:x.n===name?7:5})));
  const first = item.lines[0], pts = first.getLatLngs(), mid = pts[Math.floor(pts.length/2)];
  htgSetPoint("to", {lat:mid.lat, lng:mid.lng, label:name+" (من مربعاتي)"});
  document.getElementById("htgTo").value = name;
  try{ HTG.map.fitBounds(L.featureGroup(item.lines).getBounds(), {padding:[30,30]}); }catch(_){}
  toast("🎯 "+name+" اتحدد كوجهة — اختار مكانك وادوس وريني الطريق");
}
function areaRenderList(){
  const all = areaLoad(), box = document.getElementById("areaList");
  if(!all.length){ box.innerHTML = '<p class="muted" style="font-size:12px;margin:0">مفيش مربعات محفوظة لسه.</p>'; return; }
  box.innerHTML = all.map(a=>`<div class="row" style="gap:6px;margin:4px 0"><button type="button" class="btn btn-sm grow" style="text-align:right" data-area-open="${a.id}">🏘️ ${htgEsc(a.name)}${a.ways?" · "+new Set(a.ways.map(w=>w.name)).size+" شارع":""}</button><button type="button" class="btn btn-sm" data-area-del="${a.id}" title="مسح">🗑️</button></div>`).join("");
  box.querySelectorAll("[data-area-open]").forEach(b=>b.addEventListener("click", async ()=>{
    const a = areaLoad().find(x=>x.id===b.dataset.areaOpen); if(!a) return;
    if(!await htgEnsureMap()) return; areaMapReady();
    AREA.cur = a; AREA.drawing=false; AREA.pts=[];
    document.getElementById("areaSaveRow").style.display="none"; document.getElementById("areaHint").textContent = "📌 "+a.name;
    areaShowRect(); areaLoadStreets();
    document.getElementById("htgMap").scrollIntoView({block:"center", behavior:"smooth"});
  }));
  box.querySelectorAll("[data-area-del]").forEach(b=>b.addEventListener("click", ()=>{
    const a = areaLoad().find(x=>x.id===b.dataset.areaDel); if(!a || !confirm("تمسح مربع «"+a.name+"»؟")) return;
    areaStore(areaLoad().filter(x=>x.id!==a.id));
    if(AREA.cur && AREA.cur.id===a.id){ if(AREA.rect){ HTG.map.removeLayer(AREA.rect); AREA.rect=null; } areaClearStreets(); AREA.cur=null; }
    areaRenderList();
  }));
}
(function(){
  const $ = id=>document.getElementById(id);
  const startPick = async ()=>{
    if(!await htgEnsureMap()) return; areaMapReady();
    if(AREA.locked) $("areaLock").click();
    HTG.picking = false; AREA.drawing = true;
    $("areaHint").textContent = "👆 دوس على الخريطة في وسط المنطقة";
  };
  $("areaDraw").addEventListener("click", async ()=>{ await startPick(); $("htgMap").scrollIntoView({block:"center", behavior:"smooth"}); });
  $("areaGps").addEventListener("click", async ()=>{
    if(!navigator.geolocation){ toast("الجهاز مش بيدعم تحديد الموقع"); return; }
    $("areaHint").textContent = "⏳ بحدد موقعك...";
    navigator.geolocation.getCurrentPosition(async pos=>{ await startPick(); areaSetCenter(pos.coords.latitude, pos.coords.longitude); },
      ()=>{ $("areaHint").textContent = "❌ مقدرتش أحدد موقعك — اسمح للمتصفح بالوصول للموقع (وافتح الرابط من كروم/سفاري)"; }, {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
  });
  const doSearch = async ()=>{
    const q = $("areaQ").value.trim(); if(!q){ toast("اكتب اسم الشارع أو المنطقة"); return; }
    $("areaHint").textContent = "⏳ بدوّر...";
    try{
      if(!await htgEnsureMap()) return;
      const r = await htgGeocode(q, false);
      if(!r || !r.length){ $("areaHint").textContent = "❌ ملقيتش المكان ده — جرب تكتب الاسم مع المدينة"; return; }
      await startPick(); areaSetCenter(+r[0].lat, +r[0].lon);
      $("areaHint").textContent = "📍 "+r[0].display_name+" — دوس على الخريطة لو عايز تحرك المربع";
    }catch(_){ $("areaHint").textContent = "❌ البحث مش شغال دلوقتي — جرب تاني"; }
  };
  $("areaQBtn").addEventListener("click", doSearch);
  $("areaQ").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); doSearch(); } });
  $("areaSize").addEventListener("change", ()=>{ if(AREA.cur && AREA.cur.center && !AREA.cur.id) areaSetCenter(AREA.cur.center[0], AREA.cur.center[1]); });
  $("areaSave").addEventListener("click", ()=>{
    const name = $("areaName").value.trim();
    if(!name){ toast("اكتب اسم للمربع"); return; }
    if(!AREA.cur) return;
    const all = areaLoad();
    const rec = {id:"a"+Date.now(), name, bounds:AREA.cur.bounds, ways:AREA.cur.ways||null};
    all.push(rec);
    if(areaStore(all)){ AREA.cur = rec; AREA.drawing=false; $("areaSaveRow").style.display="none"; $("areaName").value=""; $("areaHint").textContent="💾 اتحفظ: "+name; areaRenderList(); }
  });
  $("areaLock").addEventListener("click", ()=>{
    if(!AREA.cur||!HTG.map) return;
    AREA.locked = !AREA.locked;
    if(AREA.locked){ HTG.map.setMaxBounds(L.latLngBounds(AREA.cur.bounds).pad(0.15)); HTG.map.setMinZoom(Math.max(HTG.map.getZoom()-1,12)); $("areaLock").textContent="🔒 الخريطة مثبّتة (دوس لفكها)"; }
    else{ HTG.map.setMaxBounds(null); HTG.map.setMinZoom(0); $("areaLock").textContent="🔓 ثبّت الخريطة على المربع"; }
  });
  areaRenderList();
})();

$("htgGps").addEventListener("click",htgGps);
$("htgPick").addEventListener("click",async()=>{if(await htgEnsureMap()){HTG.picking=true;$("htgMapHint").textContent="👆 دوس على الخريطة في مكانك";$("htgMap").scrollIntoView({block:"center",behavior:"smooth"});}});

let dp=null;const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;

 if(/iphone|ipad|ipod/i.test(navigator.userAgent)){$("htgInstall").style.display="";$("htgIosHint").style.display="";$("htgInstallBtn").style.display="none";}

}
window.addEventListener("appinstalled",()=>{$("htgInstall").style.display="none";});
if("serviceWorker" in navigator)navigator.serviceWorker.register("./htg-sw.js",{scope:"./howtogo.html"}).catch(()=>{});
})();
