<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>تسجيل البيانات</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B2A4A;--gold:#C9A227;--bg:#FAF7F0;--card:#fff;--ink:#1B2A4A;--muted:#6B7280;--line:#E7E1D1;--ok:#15803D;--err:#B91C1C}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .top{background:linear-gradient(135deg,#1B2A4A,#24365e);color:#fff;text-align:center;padding:22px 16px 26px;border-bottom:4px solid var(--gold)}
  .top img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--gold)}
  .top h1{margin:10px 0 2px;font-size:20px;font-weight:800}
  .top p{margin:0;font-size:13.5px;opacity:.9}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--card);border-radius:16px;border:1.5px solid var(--line);padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
  h2{margin:0 0 10px;font-size:16px}
  label.l{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px}
  label.l small{font-weight:500;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{min-height:70px;resize:vertical}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg label{flex:1 1 30%;min-width:96px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;cursor:pointer;background:#fff}
  .seg input{display:none}
  .seg input:checked+span{color:#fff}
  .seg label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
  .row2{display:flex;gap:10px}.row2>div{flex:1;min-width:0}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
  .btn-gold{background:var(--gold);color:#1B2A4A}.btn-navy{background:var(--navy);color:#fff}.btn-out{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn[disabled]{opacity:.55}
  .hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
  .err{color:var(--err);font-weight:700;font-size:13.5px;margin:10px 0 0;display:none}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
  .ok{text-align:center;padding:26px 10px}
  .ok .tick{font-size:56px}
  .hide{display:none !important}
  .chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600;font-size:14px}
  .chk input{width:auto}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="top">
  <img id="logo" src="./logo.png" alt="">
  <h1 id="churchTitle">تسجيل البيانات</h1>
  <p>سجّل بياناتك أو بيانات أولادك أو حد تعرفه ✝️</p>
</div>

<div class="wrap">
  <div id="bad" class="card hide" style="text-align:center">
    <h2>⚠️ الرابط ناقص أو غير صحيح</h2>
    <p class="hint">اطلب من الخدمة رابط التسجيل أو امسح الـ QR تاني.</p>
  </div>

  <form id="form" class="hide" autocomplete="off" novalidate>
    <div class="card">
      <h2>إنت بتسجّل بيانات مين؟</h2>
      <div class="seg" id="relSeg">
        <label><input type="radio" name="rel" value="self" checked><span>👤 نفسي</span></label>
        <label><input type="radio" name="rel" value="child"><span>👶 ابني / بنتي</span></label>
        <label><input type="radio" name="rel" value="other"><span>🤝 حد أعرفه</span></label>
      </div>
      <div id="byBox" class="hide">
        <label class="l">اسمك إنت <small>(اللي بتسجّل)</small></label>
        <input id="byName" placeholder="الاسم">
        <label class="l">رقم موبايلك</label>
        <input id="byPhone" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
      </div>
    </div>

    <div class="card">
      <h2>🎓 المرحلة</h2>
      <select id="stage">
        <option value="">— اختار المرحلة —</option>
        <optgroup label="حضانة"><option value="kg1">KG1</option><option value="kg2">KG2</option></optgroup>
        <optgroup label="ابتدائي">
          <option value="p1">أولى ابتدائي</option><option value="p2">تانية ابتدائي</option><option value="p3">تالتة ابتدائي</option>
          <option value="p4">رابعة ابتدائي</option><option value="p5">خامسة ابتدائي</option><option value="p6">سادسة ابتدائي</option>
        </optgroup>
        <optgroup label="إعدادي"><option value="prep1">أولى إعدادي</option><option value="prep2">تانية إعدادي</option><option value="prep3">تالتة إعدادي</option></optgroup>
        <optgroup label="ثانوي"><option value="sec1">أولى ثانوي</option><option value="sec2">تانية ثانوي</option><option value="sec3">تالتة ثانوي</option></optgroup>
        <optgroup label="كبار"><option value="uni">جامعة</option><option value="grad">خريجين</option></optgroup>
        <optgroup label="أسر"><option value="married">متزوجين</option></optgroup>
      </select>
    </div>

    <!-- فرد -->
    <div class="card" id="personBox">
      <h2>📝 البيانات</h2>
      <label class="l">الاسم بالكامل <small>(ثلاثي على الأقل)</small> *</label>
      <input id="name" placeholder="الاسم">
      <label class="l">النوع *</label>
      <div class="seg" id="genSeg">
        <label><input type="radio" name="gender" value="male"><span>ولد / رجل</span></label>
        <label><input type="radio" name="gender" value="female"><span>بنت / سيدة</span></label>
      </div>
      <label class="l">تاريخ الميلاد <small>(اختياري)</small></label>
      <input id="birth" type="date">
      <div id="guardBox">
        <label class="l">اسم ولي الأمر *</label>
        <input id="guardName" placeholder="اسم الأب أو الأم">
        <label class="l">رقم موبايل ولي الأمر *</label>
        <input id="guardPhone" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
      </div>
      <label class="l" id="phoneLbl">رقم الموبايل *</label>
      <input id="phone" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
    </div>

    <!-- متزوجين -->
    <div class="card hide" id="marriedBox">
      <h2>💍 بيانات الأسرة</h2>
      <label class="l">اسم الزوج بالكامل *</label>
      <input id="husband" placeholder="اسم الزوج">
      <label class="l">اسم الزوجة بالكامل *</label>
      <input id="wife" placeholder="اسم الزوجة">
      <label class="l">رقم موبايل الزوج *</label>
      <input id="mPhone" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
      <label class="l">رقم موبايل الزوجة <small>(اختياري)</small></label>
      <input id="wPhone" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
      <div class="row2">
        <div><label class="l">تاريخ الزواج <small>(اختياري)</small></label><input id="wedding" type="date"></div>
        <div><label class="l">عدد الأولاد <small>(اختياري)</small></label><input id="kids" type="number" inputmode="numeric" min="0" max="20"></div>
      </div>
    </div>

    <div class="card">
      <h2>📍 العنوان والملاحظات</h2>
      <label class="l">العنوان <small>(الشارع / المنطقة)</small></label>
      <input id="address" placeholder="مثال: شارع ... – منطقة ...">
      <div id="waBox">
        <div class="chk"><input type="checkbox" id="waSame" checked><label for="waSame">الرقم ده عليه واتساب</label></div>
        <input id="waOther" class="hide" type="tel" inputmode="tel" dir="ltr" placeholder="رقم الواتساب" style="margin-top:8px">
      </div>
      <label class="l">ملاحظات <small>(اختياري)</small></label>
      <textarea id="notes" maxlength="300"></textarea>
      <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="err" id="err"></p>
    </div>

    <button class="btn btn-gold" id="submit" type="submit">✅ تسجيل</button>
    <p class="foot">بياناتك بتوصل لخدمة الكنيسة بس.</p>
  </form>

  <div id="done" class="card ok hide">
    <div class="tick">✅</div>
    <h2 style="font-size:19px">اتسجّل بنجاح</h2>
    <p id="doneName" style="font-weight:700"></p>
    <p class="hint">ربنا يبارك حياتكم 🙏</p>
    <button class="btn btn-navy" id="again" style="margin-top:12px">➕ سجّل شخص تاني</button>
  </div>
</div>

$("logo").onerror = function(){ this.onerror = null; this.src = LOGO; };

function digits(s){ return String(s||"").replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[^\d]/g,""); }
function validPhone(s){ const d = digits(s); return d.length>=10 && d.length<=15; }
function clean(s,max){ return String(s||"").replace(/\s+/g," ").trim().slice(0,max||120); }
function showErr(m){ const e=$("err"); e.textContent=m; e.style.display = m ? "block" : "none"; if(m) e.scrollIntoView({block:"center",behavior:"smooth"}); }
const rel = () => document.querySelector('input[name="rel"]:checked').value;

function sync(){
  const st = $("stage").value, married = st==="married", minor = isMinor(st);
  $("personBox").classList.toggle("hide", married);
  $("marriedBox").classList.toggle("hide", !married);
  $("guardBox").classList.toggle("hide", !minor);
  $("phoneLbl").textContent = minor ? "رقم موبايل المخدوم (لو عنده)" : "رقم الموبايل *";
  $("byBox").classList.toggle("hide", rel()==="self");
  $("waBox").classList.toggle("hide", false);
}
document.querySelectorAll('input[name="rel"]').forEach(r=>r.addEventListener("change",sync));
$("stage").addEventListener("change",sync);
$("waSame").addEventListener("change",()=>$("waOther").classList.toggle("hide",$("waSame").checked));

function loadMe(){ try{ const m=JSON.parse(localStorage.getItem(LS)||"{}"); if(m.byName) $("byName").value=m.byName; if(m.byPhone) $("byPhone").value=m.byPhone; if(m.address) $("address").value=m.address; if(m.guardName) $("guardName").value=m.guardName; if(m.guardPhone) $("guardPhone").value=m.guardPhone; }catch(_){} }
function saveMe(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(_){} }
function rateOk(){ try{ const now=Date.now(); const a=(JSON.parse(localStorage.getItem("tasgeelRate")||"[]")).filter(t=>now-t<3600e3); if(a.length>=15) return false; a.push(now); localStorage.setItem("tasgeelRate",JSON.stringify(a)); }catch(_){} return true; }

(async function init(){
  if(!code){ $("bad").classList.remove("hide"); return; }
  try{
    const s = await getDoc(doc(db,"churches",code));
    if(!s.exists()){ $("bad").classList.remove("hide"); return; }
    const nm = s.data().name; if(nm) $("churchTitle").textContent = nm;
  }catch(e){ console.warn(e); }
  $("form").classList.remove("hide"); loadMe(); sync();
})();

$("form").addEventListener("submit", async e=>{
  e.preventDefault(); showErr("");
  if($("hp").value) return;   // سبام
  const st = $("stage").value; if(!st){ showErr("اختار المرحلة الأول"); return; }
  const r = rel(), married = st==="married", minor = isMinor(st);
  let byName="", byPhone="";
  if(r!=="self"){
    byName = clean($("byName").value,80); byPhone = digits($("byPhone").value);
    if(byName.length<2){ showErr("اكتب اسمك إنت (اللي بتسجّل)"); return; }
    if(!validPhone(byPhone)){ showErr("رقم موبايلك مش صحيح"); return; }
  }
  const data = { churchCode: code, source:"public", regType:r, regByName:byName, regByPhone:byPhone, stage:st, stageLabel:STAGES[st],
    address: clean($("address").value,200), notes: clean($("notes").value,300), createdAt: serverTimestamp() };
  let display = "";
  if(married){
    const h=clean($("husband").value,100), w=clean($("wife").value,100), p=digits($("mPhone").value);
    if(h.split(" ").length<2){ showErr("اكتب اسم الزوج كامل"); return; }
    if(w.split(" ").length<2){ showErr("اكتب اسم الزوجة كاملة"); return; }
    if(!validPhone(p)){ showErr("رقم موبايل الزوج مش صحيح"); return; }
    const wp = digits($("wPhone").value); if(wp && !validPhone(wp)){ showErr("رقم موبايل الزوجة مش صحيح"); return; }
    Object.assign(data,{ husbandName:h, wifeName:w, name:h+" و"+w, phone:p, wifePhone:wp, weddingDate:$("wedding").value||"", kidsCount:$("kids").value?Math.max(0,Math.min(20,parseInt($("kids").value)||0)):null });
    display = data.name;
  }else{
    const n=clean($("name").value,100), g=(document.querySelector('input[name="gender"]:checked')||{}).value||"";
    if(n.split(" ").length<2){ showErr("اكتب الاسم كامل (اسمين على الأقل)"); return; }
    if(!g){ showErr("اختار النوع (ولد أو بنت)"); return; }
    let p = digits($("phone").value), gn="", gp="";
    if(minor){
      gn=clean($("guardName").value,100); gp=digits($("guardPhone").value);
      if(gn.length<2){ showErr("اكتب اسم ولي الأمر"); return; }
      if(!validPhone(gp)){ showErr("رقم ولي الأمر مش صحيح"); return; }
      if(p && !validPhone(p)){ showErr("رقم موبايل المخدوم مش صحيح"); return; }
    }else if(!validPhone(p)){ showErr("رقم الموبايل مش صحيح"); return; }
    Object.assign(data,{ name:n, gender:g, birthDate:$("birth").value||"", phone:p, guardianName:gn, guardianPhone:gp });
    display = n;
  }
  if(!$("waSame").checked){ const wa=digits($("waOther").value); if(!validPhone(wa)){ showErr("اكتب رقم الواتساب صح أو علّم إن الرقم عليه واتساب"); return; } data.whatsapp = wa; }
  else data.whatsapp = married ? data.phone : (data.phone || data.guardianPhone || "");
  if(!rateOk()){ showErr("عملت تسجيلات كتير في وقت قصير، جرّب بعد شوية."); return; }
  const btn=$("submit"); btn.disabled=true; btn.textContent="جاري التسجيل…";
  try{
    await addDoc(collection(db,"registrations"), data);
    saveMe({byName, byPhone, address:data.address, guardName:data.guardianName||"", guardPhone:data.guardianPhone||""});
    $("form").classList.add("hide"); $("done").classList.remove("hide"); $("doneName").textContent = display;
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    console.error(err);
    showErr("تعذر التسجيل — تأكد من النت وجرّب تاني. لو المشكلة مستمرة كلّم الخدمة.");
  }finally{ btn.disabled=false; btn.textContent="✅ تسجيل"; }
});

$("again").addEventListener("click",()=>{
  ["name","birth","phone","husband","wife","mPhone","wPhone","wedding","kids","notes","waOther"].forEach(i=>$(i).value="");
  document.querySelectorAll('input[name="gender"]').forEach(x=>x.checked=false);
  $("waSame").checked=true; $("waOther").classList.add("hide");
  $("done").classList.add("hide"); $("form").classList.remove("hide"); loadMe(); sync();
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
